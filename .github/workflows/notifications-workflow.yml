name: Watering Sensor Check

on:
  schedule:
    - cron: '0 0 * * *'  # runs every day at 0:00 AM UTC
  workflow_dispatch:

jobs:
  run-watering-sensor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run watering sensor script
        run: node scripts/watering-sensor.js
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
